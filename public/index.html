<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>词条抽奖工具</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Temporary Entry Draw</p>
          <h1>词条提交与抽奖</h1>
          <p class="lead">提交你的词条和角色属性。管理员统一开奖后，可以用参与者名字查询抽到的结果。</p>
        </div>
        <a class="ghost-link" href="/admin">管理员入口</a>
      </section>

      <section class="grid two">
        <form class="panel" id="entryForm">
          <h2>提交词条</h2>
          <label>提交人名字 <input name="creatorName" required autocomplete="name" /></label>
          <div class="split">
            <label>头 <input name="head" required /></label>
            <label>躯干 <input name="torso" required /></label>
            <label>上肢 <input name="upperLimbs" required /></label>
            <label>下肢 <input name="lowerLimbs" required /></label>
            <label>自由特征 1 <input name="featureOne" required /></label>
            <label>自由特征 2 <input name="featureTwo" required /></label>
          </div>
          <label>性格 <textarea name="personality" rows="4" required></textarea></label>
          <button type="submit">提交词条</button>
          <p class="message" id="entryMessage"></p>
        </form>

        <form class="panel" id="resultForm">
          <h2>查询结果</h2>
          <label>参与者名字 <input name="name" required /></label>
          <button type="submit">查看我抽到了什么</button>
          <div class="result-card hidden" id="resultCard"></div>
          <p class="message" id="resultMessage"></p>
        </form>
      </section>
    </main>
    <script src="/main.js"></script>
  </body>
</html>
